test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 24
  rounds:

    - label: makeoffer_r24_1_Load@500
      description: Load @500 TPS for makeoffer_r24_1
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: ./workload_9_cache_5/makeoffer_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0307
          userId: User1
          retailerCount: 24
          lotCount: 1
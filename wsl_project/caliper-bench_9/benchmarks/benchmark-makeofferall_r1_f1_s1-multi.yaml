test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: makeofferall_r1_f1_s1_round1@500
      description: Load @500 TPS for makeofferall_r1_f1_s1
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: ./workload_9_cached/makeofferall.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2006
          userId: User1
          farmerCount: 1
          retailerCount: 1
          farmerStartIndex: 1
          retailerStartIndex: 1
          minRetailerIndex: 1
          allowedRetailerIndexes: 1
          retailerSelectionMode: paired
          lotQueryLimit: 1500


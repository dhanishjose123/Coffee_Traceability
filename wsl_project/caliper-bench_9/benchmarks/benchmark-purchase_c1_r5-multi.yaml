test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: purchase_c1_r5_Load@1
      description: Load @1 TPS for purchase_c1_r5
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/purchase.js
        arguments:
          contractId: coffee_9
          channel: agrochannel16062
          userId: User1
          consumerCount: 1
          retailerCount: 5
          packetQueryLimit: 20


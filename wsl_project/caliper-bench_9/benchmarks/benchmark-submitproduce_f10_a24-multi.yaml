test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 10
  rounds:

    - label: submitproduce_f10_a24_Load@1
      description: Load @1 TPS for submitproduce_f10_a24
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel16062
          userId: User1
          farmerCount: 10
          aggregatorCount: 24


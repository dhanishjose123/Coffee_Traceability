test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: purchase_c1_Load@1
      description: Load @1 TPS for purchase_c1
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/purchase.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0106
          userId: User1
          consumerCount: 1
          packetQueryLimit: 1000


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: acceptoffer_f5_r24_Load@1
      description: Load @1 TPS for acceptoffer_f5_r24
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel16062
          userId: User1
          farmerCount: 5
          retailerCount: 24
          lotQueryLimit: 20


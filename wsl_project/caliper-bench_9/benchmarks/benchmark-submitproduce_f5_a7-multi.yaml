test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: submitproduce_f5_a7_Load@1
      description: Load @1 TPS for submitproduce_f5_a7
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2905
          userId: User1
          farmerCount: 5
          aggregatorCount: 7


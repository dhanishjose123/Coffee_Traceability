test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: pack_r5_Load@1
      description: Load @1 TPS for pack_r5
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/pack.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0307
          userId: User1
          retailerCount: 5
          lotQueryLimit: 20


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 24
  rounds:

    - label: purchase_c24_r5_Load@1
      description: Load @1 TPS for purchase_c24_r5
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/purchase.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0606
          userId: User1
          consumerCount: 24
          retailerCount: 5
          packetQueryLimit: 200


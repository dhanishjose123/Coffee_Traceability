    - label: submitproduce_f15_a15_Load@400
      description: Load @400 TPS for submitproduce_f15_a15
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 400
      workload:
        module: ./workload_9_cache_5/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0307
          userId: User1
          farmerCount: 15
          aggregatorCount: 15
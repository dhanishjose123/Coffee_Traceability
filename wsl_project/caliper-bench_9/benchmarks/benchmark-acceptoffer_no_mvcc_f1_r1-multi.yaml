test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: acceptoffer_no_mvcc_f1_r1_Load@1
      description: Load @1 TPS for acceptoffer_no_mvcc_f1_r1
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0606
          userId: User1
          farmerCount: 1
          retailerCount: 1
          contractFunction: acceptOfferNoMVCC
          lotQueryLimit: 200


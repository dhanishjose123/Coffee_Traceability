test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 3
  rounds:

    - label: testcoffee_a3_Load@1
      description: Load @1 TPS for testcoffee_a3
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/testcoffee.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0906
          userId: User1
          aggregatorCount: 3
          lotQueryLimit: 20


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 3
  rounds:

    - label: submitproduce_f3_a8_Load@1
      description: Load @1 TPS for submitproduce_f3_a8
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0906
          userId: User1
          farmerCount: 3
          aggregatorCount: 8


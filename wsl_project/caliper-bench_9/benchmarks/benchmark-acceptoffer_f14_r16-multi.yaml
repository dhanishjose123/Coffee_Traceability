test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 14
  rounds:

    - label: acceptoffer_f14_r16_Load@1
      description: Load @1 TPS for acceptoffer_f14_r16
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0906
          userId: User1
          farmerCount: 14
          retailerCount: 16
          lotQueryLimit: 20


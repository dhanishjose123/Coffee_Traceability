test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 24
  rounds:

    - label: makeoffer_r24_40_Load@1
      description: Load @1 TPS for makeoffer_r24_40
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/makeoffer_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2406
          userId: User1
          retailerCount: 24
          lotCount: 40


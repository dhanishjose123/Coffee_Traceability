test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 18
  rounds:

    - label: pack_r18_Load@1
      description: Load @1 TPS for pack_r18
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/pack.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0906
          userId: User1
          retailerCount: 18
          lotQueryLimit: 20


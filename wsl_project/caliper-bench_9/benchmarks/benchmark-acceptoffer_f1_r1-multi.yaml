test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: acceptoffer_f1_r1_Load@1
      description: Load @1 TPS for acceptoffer_f1_r1
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cache_5/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0307
          userId: User1
          farmerCount: 1
          retailerCount: 1
          lotQueryLimit: 20


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: testcoffee_a2_Load@400
      description: Load @400 TPS for testcoffee_a2
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 400
      workload:
        module: ./workload_9_cache_5/testcoffee.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0307
          userId: User1
          aggregatorCount: 2
          lotQueryLimit: 1500
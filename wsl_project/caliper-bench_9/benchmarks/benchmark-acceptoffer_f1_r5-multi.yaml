test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: acceptoffer_f1_r5_Load@20
      description: Load @20 TPS for acceptoffer_f1_r5
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: ./workload_9_cached/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2006
          userId: User1
          farmerCount: 1
          retailerCount: 5
          lotQueryLimit: 120


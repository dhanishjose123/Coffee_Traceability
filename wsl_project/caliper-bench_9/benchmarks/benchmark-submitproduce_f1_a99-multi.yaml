test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: submitproduce_f1_a99_Load@1
      description: Load @1 TPS for submitproduce_f1_a99
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel31052
          userId: User1
          farmerCount: 1
          aggregatorCount: 99


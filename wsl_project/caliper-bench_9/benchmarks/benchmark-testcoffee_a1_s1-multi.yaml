test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: testcoffee_a1_s1_round1@500
      description: Load @500 TPS for testcoffee_a1_s1
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: ./workload_9_cached/testcoffee.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2006
          userId: User1
          aggregatorCount: 1
          aggregatorStartIndex: 1
          lotQueryLimit: 1500


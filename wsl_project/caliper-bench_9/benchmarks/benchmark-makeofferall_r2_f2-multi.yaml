test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 2
  rounds:

    - label: makeofferall_r2_f2_round1@500
      description: Load @500 TPS for makeofferall_r2_f2
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: ./workload_9_cached/makeofferall.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2106
          userId: User1
          farmerCount: 2
          retailerCount: 2
          farmerStartIndex: 1
          retailerStartIndex: 1
          minRetailerIndex: 1
          allowedRetailerIndexes: 1,2
          retailerSelectionMode: paired
          lotQueryLimit: 1500


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 5
  rounds:

    - label: purchase_c5_r10_Load@1
      description: Load @1 TPS for purchase_c5_r10
      txDuration: 6
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9_cached/purchase.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2406
          userId: User1
          consumerCount: 5
          retailerCount: 10
          retailerSelectionMode: paired
          packetQueryLimit: 20


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 3
  rounds:

    - label: acceptoffer_f3_r7_Load@1
      description: Load @1 TPS for acceptoffer_f3_r7
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/acceptoffer.js
        arguments:
          contractId: coffee_9
          channel: agrochannel2905
          userId: User1
          farmerCount: 3
          retailerCount: 7


test:
  name: Coffee Chaincode Load Test
  description: Benchmarking under increasing load
  workers:
    type: local
    number: 1
  rounds:

    - label: submitproduce_no_mvcc_f1_a1_Load@1
      description: Load @1 TPS for submitproduce_no_mvcc_f1_a1
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: ./workload_9/submitproduce_matrix.js
        arguments:
          contractId: coffee_9
          channel: agrochannel0606
          userId: User1
          farmerCount: 1
          aggregatorCount: 1
          contractFunction: submitProduceNoMVCC

